name: Build and Push Scanner Image to GHCR

on:
  push:
    paths:
      - '02-Prisma-AIRS/02-AI Supply Chain Security/app/**'
      - '.github/workflows/build-scanner.yml'
    branches: [ main, master ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./02-Prisma-AIRS/02-AI Supply Chain Security/app
          file: ./02-Prisma-AIRS/02-AI Supply Chain Security/app/Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/airs-model-scanner:latest