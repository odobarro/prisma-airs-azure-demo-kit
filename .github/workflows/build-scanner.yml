name: Build and Deploy Prisma AIRS Scanner

on:
  push:
    branches:
      - main
    paths:
      - '02-Prisma-AIRS/02-AI Supply Chain Security/app/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/airs-model-scanner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch PANW PyPI Token on Host Runner
        id: get_pypi
        run: |
          sed -i 's/\r$//' ./02-Prisma-AIRS/02-AI\ Supply\ Chain\ Security/app/get_pypi_url.sh
          chmod +x ./02-Prisma-AIRS/02-AI\ Supply\ Chain\ Security/app/get_pypi_url.sh
          URL=$(./02-Prisma-AIRS/02-AI\ Supply\ Chain\ Security/app/get_pypi_url.sh)
          echo "pypi_url=${URL}" >> $GITHUB_OUTPUT
        env:
          MODEL_SECURITY_CLIENT_ID: ${{ secrets.MODEL_SECURITY_CLIENT_ID }}
          MODEL_SECURITY_CLIENT_SECRET: ${{ secrets.MODEL_SECURITY_CLIENT_SECRET }}
          TSG_ID: ${{ secrets.TSG_ID }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: "./02-Prisma-AIRS/02-AI Supply Chain Security/app"
          file: "./02-Prisma-AIRS/02-AI Supply Chain Security/app/Dockerfile"
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            PYPI_URL=${{ steps.get_pypi.outputs.pypi_url }}
          cache-from: type=gha
          cache-to: type=gha,mode=max