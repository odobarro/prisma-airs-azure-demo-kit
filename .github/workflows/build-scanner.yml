name: Build and Deploy Prisma AIRS Scanner

on:
  push:
    branches:
      - main
    paths:
      - '02-Prisma-AIRS/02-AI Supply Chain Security/app/**'
  workflow_dispatch: # Permite lanzar el pipeline manualmente desde la interfaz de GitHub

env:
  REGISTRY: ghcr.io
  # Asegúrate de que esto coincida con la ruta de tu imagen en Azure (ej. odobarro/airs-model-scanner)
  IMAGE_NAME: ${{ github.repository_owner }}/airs-model-scanner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Necesario para hacer push a GitHub Container Registry (GHCR)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

- name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: "./02-Prisma-AIRS/02-AI Supply Chain Security/app"
          file: "./02-Prisma-AIRS/02-AI Supply Chain Security/app/Dockerfile"
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            MODEL_SECURITY_CLIENT_ID=${{ secrets.MODEL_SECURITY_CLIENT_ID }}
            MODEL_SECURITY_CLIENT_SECRET=${{ secrets.MODEL_SECURITY_CLIENT_SECRET }}
            TSG_ID=${{ secrets.TSG_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max