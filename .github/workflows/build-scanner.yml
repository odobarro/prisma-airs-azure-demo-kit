name: Build and Deploy Prisma AIRS Scanner

on:
  push:
    branches:
      - main
    paths:
      - '02-Prisma-AIRS/02-AI Supply Chain Security/app/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/airs-model-scanner

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # 🛠️ CRÍTICO: Fuerza al motor Buildx a usar el DNS de la máquina host de GitHub
          driver-opts: network=host 

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: "./02-Prisma-AIRS/02-AI Supply Chain Security/app"
          file: "./02-Prisma-AIRS/02-AI Supply Chain Security/app/Dockerfile"
          push: true
          # 🛠️ CRÍTICO: Permite que el script get_pypi_url.sh resuelva auth.sase.paloaltonetworks.com sin exit code 6
          network: host 
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            MODEL_SECURITY_CLIENT_ID=${{ secrets.MODEL_SECURITY_CLIENT_ID }}
            MODEL_SECURITY_CLIENT_SECRET=${{ secrets.MODEL_SECURITY_CLIENT_SECRET }}
            TSG_ID=${{ secrets.TSG_ID }}
          # FinOps: Uso de caché para ahorrar minutos de facturación
          cache-from: type=gha
          cache-to: type=gha,mode=max